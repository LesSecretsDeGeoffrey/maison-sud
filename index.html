<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<title>Maison Sud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ecume: #EEF3F1; --papier: #FFFFFF; --encre: #14273B; --encre-douce: #51637A; --trait: #D3DDD9;
    --plaque: #1F4B8E; --pin: #2B5B4B; --ocre: #9A6408; --ocre-fond: #F6E7C8; --bougainvillier: #B8336A;
    --titre: 'Barlow Semi Condensed', 'Arial Narrow', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; font: 16px/1.45 Barlow, system-ui, sans-serif; color: var(--encre); background: var(--ecume); }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--ocre); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* Bandeau */
  .haut { display: flex; align-items: center; gap: 20px; padding: 10px 20px; background: var(--papier); border-bottom: 1px solid var(--trait); flex-wrap: wrap; }
  .marque { font: 700 24px/1 var(--titre); margin: 0; white-space: nowrap; }
  .onglets { display: flex; gap: 4px; flex-wrap: wrap; }
  .onglets button { border: 0; background: none; padding: 7px 12px; border-radius: 8px; font-weight: 500; white-space: nowrap; }
  .onglets button:hover { background: var(--ecume); }
  .onglets button[aria-current="true"] { background: var(--encre); color: #fff; }
  .onglets .nb { font-weight: 400; opacity: .75; margin-left: 4px; }
  .robot { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--encre-douce); flex-wrap: wrap; }
  .robot .site { display: inline-flex; align-items: center; gap: 5px; }
  .robot .site::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--pin); }
  .robot .site.bloque { color: var(--ocre); font-weight: 600; }
  .robot .site.bloque::before { background: var(--ocre); }
  .robot button { border: 1px solid var(--trait); background: var(--papier); border-radius: 8px; padding: 5px 10px; }
  .alerte { margin: 0; padding: 8px 20px; background: var(--ocre-fond); color: #5E3C02; font-weight: 500; }

  /* Deux colonnes : la liste, la maison choisie */
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(340px, 440px) 1fr; }
  .liste { overflow: auto; border-right: 1px solid var(--trait); }
  .detail { overflow: auto; background: var(--papier); }
  .reglage { display: flex; align-items: center; gap: 8px; padding: 10px 16px; font-size: 15px; color: var(--encre-douce); border-bottom: 1px solid var(--trait); }
  .vide { padding: 28px 20px; color: var(--encre-douce); max-width: 46ch; }

  .ligne { display: grid; grid-template-columns: 112px 1fr; gap: 12px; width: 100%; padding: 12px 16px 12px 12px; text-align: left;
    border: 0; border-left: 4px solid transparent; border-bottom: 1px solid var(--trait); background: none; }
  .ligne:hover { background: #E6EDEA; }
  .ligne.choisie { background: var(--papier); border-left-color: var(--plaque); }
  .vignette { width: 112px; height: 84px; border-radius: 6px; overflow: hidden; background: #DCE5E1; display: block; }
  .vignette img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .sans-photo img { visibility: hidden; }
  .ligne .loyer { font: 700 21px/1.1 var(--titre); display: block; }
  .ligne .lieu { display: block; font-weight: 500; }
  .ligne .mesures { display: block; font-size: 15px; color: var(--encre-douce); }
  .puces { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .puce { font-size: 13px; line-height: 1.5; padding: 0 8px; border-radius: 99px; border: 1px solid var(--trait); background: var(--papier); white-space: nowrap; }
  .puce.nouveau { background: var(--ocre-fond); border-color: #E3C78A; color: #5E3C02; font-weight: 600; }
  .puce.ideal { border-color: var(--pin); color: var(--pin); font-weight: 600; }
  .puce.verifier { border-style: dashed; border-color: var(--ocre); color: var(--ocre); }
  .puce.aime { background: var(--bougainvillier); border-color: var(--bougainvillier); color: #fff; font-weight: 600; }
  .puce.suivi { background: var(--encre); border-color: var(--encre); color: #fff; }

  details.replie { border-bottom: 1px solid var(--trait); }
  details.replie > summary { padding: 12px 16px; color: var(--encre-douce); cursor: pointer; }
  details.replie .ligne { opacity: .8; }

  /* La maison choisie */
  .fiche { max-width: 900px; padding: 22px 32px 56px; }
  .retour { display: none; }
  .photo { position: relative; background: var(--encre); border-radius: 10px; overflow: hidden; height: min(54vh, 520px); }
  .photo img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .photo .pas { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255,255,255,.9); font-size: 22px; line-height: 1; }
  .photo .pas.avant { left: 12px; } .photo .pas.apres { right: 12px; }
  .photo .compte { position: absolute; right: 12px; bottom: 10px; background: rgba(20,39,59,.8); color: #fff; font-size: 14px; padding: 2px 10px; border-radius: 99px; }
  .photo.sans-photo::after, .photo.aucune::after { content: 'Photo indisponible ici : ouvre l\'annonce'; position: absolute; inset: 0; display: grid; place-items: center; color: #C9D6E4; }
  .entete { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; margin-top: 22px; flex-wrap: wrap; }
  /* la plaque de rue émaillée : la commune comme on la lit au coin d'une rue */
  .plaque { display: inline-block; background: var(--plaque); color: #fff; font: 700 30px/1.05 var(--titre); letter-spacing: .05em; text-transform: uppercase;
    padding: 14px 24px 13px; border-radius: 7px; box-shadow: inset 0 0 0 4px var(--plaque), inset 0 0 0 6px #fff; margin: 0; }
  .quartier { margin: 8px 0 0; color: var(--encre-douce); }
  .prix { text-align: right; }
  .prix strong { font: 700 38px/1 var(--titre); display: block; }
  .prix span { color: var(--encre-douce); font-size: 15px; }
  .fiche .puces { margin-top: 16px; }
  .fiche .puce { font-size: 14px; padding: 1px 10px; }
  .gestes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; align-items: center; }
  .geste { padding: 9px 16px; border-radius: 9px; border: 1.5px solid var(--encre); background: var(--papier); font-weight: 600; }
  .geste[aria-pressed="true"] { background: var(--encre); color: #fff; }
  .geste.aime[aria-pressed="true"] { background: var(--bougainvillier); border-color: var(--bougainvillier); }
  .gestes label { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; }
  .gestes input[type="date"] { padding: 7px 8px; border: 1.5px solid var(--encre); border-radius: 9px; }
  .note { margin-top: 14px; display: grid; gap: 8px; max-width: 620px; }
  .note textarea { min-height: 76px; padding: 10px 12px; border: 1px solid var(--trait); border-radius: 9px; resize: vertical; background: #FAFCFB; }
  .note .bas { display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--encre-douce); }
  .note button { padding: 7px 14px; border-radius: 9px; border: 1px solid var(--encre); background: var(--papier); font-weight: 500; }
  .faits { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 0 28px; margin: 26px 0 0; }
  .faits div { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--trait); }
  .faits dt { color: var(--encre-douce); } .faits dd { margin: 0; font-weight: 500; text-align: right; }
  .texte { margin: 22px 0 0; max-width: 68ch; white-space: pre-line; }
  h2 { font: 700 20px/1.2 var(--titre); margin: 30px 0 10px; }
  .sources { display: flex; flex-wrap: wrap; gap: 10px; }
  .sources a { display: inline-flex; flex-direction: column; padding: 9px 16px; border-radius: 9px; background: var(--plaque); color: #fff; text-decoration: none; font-weight: 600; }
  .sources a small { font-weight: 400; opacity: .85; }
  .dates { margin-top: 18px; font-size: 14px; color: var(--encre-douce); }

  /* Écran du code */
  .porte { margin: auto; padding: 24px; width: min(100%, 400px); }
  .porte h1 { font: 700 34px/1.05 var(--titre); margin: 0 0 6px; }
  .porte p { margin: 0 0 18px; color: var(--encre-douce); }
  .porte label { display: block; font-weight: 500; margin: 14px 0 4px; }
  .porte input { width: 100%; padding: 11px 12px; border: 1.5px solid var(--encre); border-radius: 9px; background: var(--papier); }
  .porte button { margin-top: 18px; width: 100%; padding: 12px; border: 0; border-radius: 9px; background: var(--plaque); color: #fff; font-weight: 600; }
  .porte .refus { color: #A32020; font-weight: 500; min-height: 1.5em; margin: 10px 0 0; }

  @media (max-width: 899px) {
    .haut { gap: 10px; padding: 10px 14px; }
    .onglets { flex-wrap: nowrap; overflow-x: auto; width: 100%; order: 3; }
    .robot { font-size: 13px; gap: 8px; }
    main { display: block; overflow: auto; }
    .liste { border-right: 0; overflow: visible; }
    .detail { display: none; position: fixed; inset: 0; z-index: 10; }
    body.fiche-ouverte .detail { display: block; }
    .fiche { padding: 12px 16px 48px; }
    .retour { display: inline-block; margin-bottom: 12px; padding: 8px 14px; border-radius: 9px; border: 1px solid var(--encre); background: var(--papier); font-weight: 500; }
    .photo { height: 44vh; }
    .plaque { font-size: 24px; padding: 11px 18px 10px; }
    .prix { text-align: left; }
    .prix strong { font-size: 32px; }
  }
</style>
</head>
<body>
<div id="app" style="display: contents"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
